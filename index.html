<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quan sát mèo 3D · Tìm ý viết văn</title>
    <style>
      .boot-loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:32px 24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 42%,#faf8f1 0%,#f4f0e6 58%,#efebdf 100%);color:#454e3d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
      .boot-loading-card{width:min(100%,430px)}
      .boot-loading-character{position:relative;display:grid;place-items:center;width:176px;height:176px;margin:0 auto 14px;border:1px solid #d8ddca;border-radius:50%;background:#e8ecdd80;box-sizing:border-box}
      .boot-loading-cat{display:grid;place-items:center;width:148px;height:148px;border:1px solid #d3d9c3;border-radius:50%;background:#faf9f2;color:#697a58;box-sizing:border-box}
      .boot-loading-paws{display:flex;justify-content:center;gap:12px;height:18px;margin-bottom:21px;color:#8a9978}
      .boot-loading-paws svg{animation:boot-loading-step 1.65s ease-in-out infinite}.boot-loading-paws svg:nth-child(2){animation-delay:160ms}.boot-loading-paws svg:nth-child(3){animation-delay:320ms}
      .boot-loading h2{margin:0 0 10px;font-size:clamp(24px,4vw,30px);line-height:1.25;font-weight:650;letter-spacing:-.035em}
      .boot-loading p{margin:0;color:#67705c;font-size:15px;line-height:1.65}
      .boot-loading-bar{position:relative;width:min(232px,75%);height:4px;margin:27px auto 0;overflow:hidden;border-radius:8px;background:#e0e3d4}
      .boot-loading-bar::after{content:"";position:absolute;inset:0 auto 0 0;width:44%;border-radius:inherit;background:#879878;animation:boot-loading-glide 2.1s ease-in-out infinite}
      @keyframes boot-loading-step{0%,70%,100%{opacity:.3;transform:translateY(2px) scale(.94)}35%{opacity:.85;transform:translateY(-3px) scale(1)}}
      @keyframes boot-loading-glide{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
      @media(max-height:500px){.boot-loading{padding:20px}.boot-loading-character{width:128px;height:128px;margin-bottom:8px}.boot-loading-cat{width:104px;height:104px}.boot-loading-cat svg{width:54px;height:54px}.boot-loading-paws{margin-bottom:12px}.boot-loading h2{font-size:22px}.boot-loading p{font-size:14px}.boot-loading-bar{margin-top:17px}}
      @media(prefers-reduced-motion:reduce){.boot-loading-paws svg,.boot-loading-bar::after{animation:none}.boot-loading-bar::after{transform:translateX(64%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-live="polite" aria-atomic="true">
        <div class="boot-loading-card">
          <div class="boot-loading-character" aria-hidden="true">
            <div class="boot-loading-cat">
              <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="M5 9 4 3l6 3h4l6-3-1 6c1.4 1.3 2 2.9 2 4.5 0 4.3-4 7.5-9 7.5s-9-3.2-9-7.5c0-1.6.6-3.2 2-4.5Z" />
                <path d="M8 14v.5m8-.5v.5m-4 1.5-1 .5 1 .5 1-.5-1-.5Z" />
              </svg>
            </div>
          </div>
          <div class="boot-loading-paws" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" focusable="false"><ellipse cx="12" cy="16" rx="5" ry="4" /><circle cx="5" cy="9" r="2" /><circle cx="10" cy="5" r="2" /><circle cx="16" cy="5" r="2" /><circle cx="20" cy="10" r="2" /></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" focusable="false"><ellipse cx="12" cy="16" rx="5" ry="4" /><circle cx="5" cy="9" r="2" /><circle cx="10" cy="5" r="2" /><circle cx="16" cy="5" r="2" /><circle cx="20" cy="10" r="2" /></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" focusable="false"><ellipse cx="12" cy="16" rx="5" ry="4" /><circle cx="5" cy="9" r="2" /><circle cx="10" cy="5" r="2" /><circle cx="16" cy="5" r="2" /><circle cx="20" cy="10" r="2" /></svg>
          </div>
          <h2>Chú mèo đang đến…</h2>
          <p>Đang chuẩn bị căn phòng để em quan sát.</p>
          <div class="boot-loading-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
